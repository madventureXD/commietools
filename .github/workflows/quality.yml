# Pflichtprüfungen bei Änderungen an `main` und bei Pull Requests (Karte M1-003).
#
# **Warum versioniert:** Bis zum 2026-10-06 gab es im Repository **keinen** erkennbaren
# Freigabeschutz — `main` ist der Produktionsbranch bei Cloudflare Pages, ein Push veröffentlicht
# also commietools.org. Ob zusätzlich ein Branchschutz im Konto eingerichtet ist, ist von außen
# nicht feststellbar und wird hier ausdrücklich **nicht** behauptet (Karte: „Kein Beweis fehlenden
# Kontoschutzes aus fehlender YAML ableiten"). Diese Datei ist der im Repository sichtbare Teil:
# Sie macht die Prüfungen zur Pflicht, die vorher nur lokal liefen.
#
# **Nicht enthalten und bewusst nicht:** kein Deployment, keine Geheimnisse, keine
# Kontoeinstellungen. Dieser Workflow prüft nur.
#
# **Grenze, die der Betreiber schließen muss:** Ein Workflow allein blockiert keinen Merge. Dafür
# sind im Konto „erforderliche Statuschecks" und ein Branchschutz zu konfigurieren; das gehört mit
# Datum und Zuständigkeit protokolliert (Karte M1-003, Abnahme).
#
# **Zweite Grenze (Stand 2026-10-06):** Die gebauten Browserprüfungen (`viewport:check`,
# `a11y:check`) liefen nur lokal: `scripts/viewport-audit.mjs` steuert Edge auf Windows. Ein
# Linux-Läufer kann das nicht. Der Browserjob war deshalb nicht verdrahtet.
#
# **Nachtrag 2026-10-07 (Karte M2-009):** Der Browserjob ist jetzt da und läuft auf
# `windows-latest`, weil der Prüfer Edge und ein Windows-Terminal braucht. Die frühere Grenze
# bleibt als **Grenze des Belegs** bestehen: Der Job ist **nie gelaufen** (es wird nicht gepusht),
# und ein Lauf auf einem fremden Rechner beweist die Auslieferung nicht — er belegt nur, dass die
# Prüfung dort greift, wo sie läuft. Siehe die Anmerkungen am Job selbst.
name: Prüfungen
# Nachtrag 2026-10-08: Die historischen Tag-/fehlender-Job-Kommentare oben gelten nicht
# mehr für die Konfiguration darunter. Alle Actions sind an geprüfte Commits gebunden.
# Browser prüft das hochgeladene Qualitätsartefakt; Releasepflicht verlangt drei success.
# Reale Konto-/Deploymentkopplung und ein tatsächlicher GitHub-Lauf bleiben unbelegt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimale Rechte: Lesen genügt zum Prüfen.
permissions:
  contents: read

# Läuft von Hand gestartet genauso wie automatisch.

jobs:
  qualitaet:
    name: Lizenz, Katalog, Lint, Typen, Tests, Bau
    runs-on: ubuntu-latest
    steps:
      # Versionen mit Tag gepinnt. **Offen:** auf Commit-SHAs umstellen, sobald der Workflow in
      # Betrieb geht (Karte M1-003 verlangt es) — ein erfundener SHA wäre schlimmer als ein Tag.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      # Installation aus dem Lockstand, nicht aus den Manifesten.
      - run: npm ci
      # `check` enthält Lizenzprüfung, Katalogprüfung, Lint, Typprüfung und Tests.
      - run: npm run check
      # Der Bau prüft zusätzlich das Startbudget und die Sperre gegen PDF-Engines im Startbündel.
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-dist
          path: apps/web/dist
          if-no-files-found: error

  # Barrierefreiheit und Überbreite im echten Browser (Karte M2-009).
  #
  # **Warum Windows:** `scripts/viewport-audit.mjs` steuert Edge headless über das
  # DevTools-Protokoll; Edge und die Pfadangabe sind Windows-spezifisch. Auf `ubuntu-latest`
  # würde der Job nicht laufen — ein Job, der in der Wirklichkeit nicht läuft, wäre schlimmer
  # als keiner.
  #
  # **Grenzen dieses Jobs, ausdrücklich:**
  #  1. Er ist **nie gelaufen** — es wird nicht gepusht, also hat GitHub ihn nicht ausgeführt.
  #     Eine erfolgreiche Meldung ohne Ausführung wäre eine Falschaussage.
  #  2. Er prüft den **Bau** auf dem Läufer, nicht die ausgelieferte Seite. Die Prüfung gilt
  #     damit der Prüfung selbst, nicht der Veröffentlichung.
  #  3. Actions sind mit Tags gepinnt (`@v4`), nicht mit Commit-SHAs (offen, wie in `qualitaet`).
  #  4. Er ersetzt **keine** erforderlichen Statuschecks im Konto und keine Handarbeit:
  #     Vorleserausgabe, Tastaturdurchlauf, 400 % Zoom, Fokusreihenfolge und reduzierte Bewegung
  #     bleiben ungeprüft (der Prüfer sagt das am Ende seines Laufs selbst).
  #
  # **Voraussetzung, die scheitern DARF:** Der Läufer braucht Edge unter dem im Prüfer
  # hinterlegten Pfad. Fehlt es, bricht der Lauf mit Fehler ab — das ist gewollt: ein stiller
  # grüner Lauf ohne Messung wäre der schlimmere Ausgang.
  browser:
    name: Barrierefreiheit und Überbreite (Windows, Edge)
    needs: qualitaet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Der Prüfer läuft gegen die BAUdateien: erst bauen, dann ausliefern.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-dist
          path: apps/web/dist
      - name: Vorschaudienst starten
        run: Start-Process -FilePath "node" -ArgumentList "scripts/belege/dist-server-cli.mjs" -WindowStyle Hidden
      - name: Auf den Vorschaudienst warten
        shell: pwsh
        run: |
          for ($versuch = 0; $versuch -lt 60; $versuch++) {
            try {
              $antwort = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4173/" -TimeoutSec 3
              if ($antwort.StatusCode -eq 200) { Write-Host "Vorschaudienst bereit nach $versuch Versuchen"; exit 0 }
            } catch { Start-Sleep -Seconds 2 }
          }
          throw "Vorschaudienst auf 127.0.0.1:4173 nicht erreichbar"
      # Beide Schemata: der Kontrast unterscheidet sich deutlich (Token --color-action-text).
      - run: npm run a11y:check
        env:
          COMMIETOOLS_AUDIT_URL: http://127.0.0.1:4173
          COMMIETOOLS_AUDIT_SCHEME: dark
      - run: npm run a11y:check
        env:
          COMMIETOOLS_AUDIT_URL: http://127.0.0.1:4173
          COMMIETOOLS_AUDIT_SCHEME: light
      - run: npm run viewport:check
        env:
          COMMIETOOLS_AUDIT_URL: http://127.0.0.1:4173
      - run: npm run async:browser
      - run: npm run pdf:browser
      - run: node scripts/ocr-browser-audit.mjs
      - run: node scripts/offline-browser-audit.mjs
      - run: node scripts/menu-keyboard-audit.mjs
      - run: node scripts/download-browser-audit.mjs
      - run: node scripts/menu-mutants.mjs
      - run: node scripts/pdf-mutants.mjs
      - run: node scripts/de-browser-audit.mjs
      - run: node scripts/craft-browser-audit.mjs
      - run: node scripts/offline-locale-audit.mjs
      - run: node scripts/pdf-ui-acceptance.mjs
      - run: node scripts/result-states-audit.mjs

  rust:
    name: Rust-Prüfungen (nativ und wasm32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      # Beide Ziele, weil die WASM-Hülle andere Abhängigkeiten sieht als der native Bau
      # (siehe die getrandom-Falle aus M9-004).
      - run: cargo check --locked --manifest-path crates/pdf-signer-engine/Cargo.toml
      - run: cargo test --locked --manifest-path crates/pdf-signer-engine/Cargo.toml
      - run: cargo check --locked --manifest-path crates/pdf-signer-wasm/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - run: node scripts/build-signer.mjs tmp/ci-wasm tmp/rebuilt-wasm
      - run: node -e "const fs=require('fs'); if(!fs.readFileSync('packages/tools/src/pdf/m7-wasm/engine_bg.wasm').equals(fs.readFileSync('tmp/rebuilt-wasm/engine_bg.wasm'))) process.exit(1)"

  required:
    name: Releasepflicht
    if: ${{ always() }}
    needs: [qualitaet, browser, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Pflichtjobs müssen erfolgreich sein
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS); const ids=["qualitaet","browser","rust"]; if(ids.some(id=>n[id]?.result!=="success") || Object.keys(n).length!==ids.length) process.exit(1)'
